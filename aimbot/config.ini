# =============================================================================
#  aimbot configuration  (key = value, lines starting with # are comments)
# =============================================================================

# ---- target ------------------------------------------------------------------
process  = shooter.exe
# 0 = find g_game automatically (scan for the magic string).
# Or put the RVA shown in the game's debug overlay (F1) / shooter_offsets.txt,
# e.g. game_rva = 0x1A2B30
game_rva = 0

# ---- how to read memory -----------------------------------------------------------
#   dma     MemProcFS + FPGA DMA card (the game runs on ANOTHER PC)
#   winapi  ReadProcessMemory, game on THIS PC (for testing without hardware)
memory   = dma
# Arguments for MemProcFS (VMMDLL_Initialize). Examples:
#   -device fpga                  normal FPGA card
#   -device fpga -memmap auto     if reads fail on some systems
dma_args = -device fpga

# ---- how to move the mouse ------------------------------------------------------------
#   kmbox_b    KMBox B / B+ / B Pro via COM port
#   kmbox_net  KMBox Net via network (needs the vendor library, see README)
#   sendinput  Windows SendInput on THIS PC (testing, with memory = winapi)
#   none       don't move, just run the logic
mouse      = kmbox_b
kmbox_port = COM3
kmbox_baud = 115200
kmnet_ip   = 192.168.2.188
kmnet_port = 8888
kmnet_uuid = 00000000

# ---- aimbot ---------------------------------------------------------------------------
# key that activates the aimbot (read from the GAME's memory!): rmb | lmb | mmb | always
aim_key       = rmb
# only targets within this many pixels of the crosshair
fov           = 200
# 1 = snap instantly, 2..10 = smoother / slower
smooth        = 3
# max pixels per step
max_step      = 80
# don't move if closer than this many pixels
deadzone      = 1
# mouse counts per screen pixel -> run "aimbot calibrate" to measure it
mouse_scale   = 1.0
# aim where the enemy WILL be when the bullet arrives (uses velocity from memory)
prediction    = true
# ignore enemies behind walls (uses Entity::visible from memory)
visible_only  = true
# stay on the same target while the key is held
sticky_target = true

# ---- loop -----------------------------------------------------------------------------
# pause between reads in microseconds (0 = as fast as possible)
poll_interval_us = 500
